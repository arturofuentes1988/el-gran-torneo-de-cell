<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>El Gran Torneo de Cell</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07040c;
      }
      body { touch-action: none; user-select: none; }
      canvas { display: block; }
      /* En pantalla completa no se ve el puntero. */
      :fullscreen canvas { cursor: none; }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffd27a;
        font: 16px monospace;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div id="loading">CARGANDO...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
