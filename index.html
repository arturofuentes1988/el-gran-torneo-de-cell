<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07040c" />
    <meta name="description" content="El Gran Torneo de Cell: juego de pelea 2D gratis en el navegador, con ranking de jugadores." />
    <title>El Gran Torneo de Cell</title>
    <link rel="icon" type="image/png" href="icono.png" />
  </head>
  <body>
    <header class="cabecera">
      <a class="logo" href="./">EL GRAN TORNEO <b>DE CELL</b></a>
      <div class="en-vivo" hidden>
        <span class="jugadores" hidden><span class="punto"></span><span class="texto"></span></span>
        <span class="visitas" hidden></span>
      </div>
      <div class="derecha">
        <nav class="pestanas">
          <button type="button" data-pestana="jugar" class="activa">JUGAR</button>
          <button type="button" data-pestana="ranking">RANKING</button>
        </nav>
        <div id="cuenta" hidden>
          <button type="button" class="chip" aria-haspopup="menu"><span class="avatar"></span><span class="apodo"></span></button>
          <div class="menu-cuenta" role="menu" hidden>
            <button type="button" data-accion="avatar">CAMBIAR AVATAR</button>
            <button type="button" data-accion="salir">CERRAR SESIÓN</button>
          </div>
        </div>
      </div>
    </header>
    <main>
      <section id="jugar" class="pestana">
        <div class="marco">
          <iframe id="juego" title="El Gran Torneo de Cell" allow="fullscreen; autoplay; gamepad"></iframe>
        </div>
        <p class="ayuda">
          FLECHAS PARA MOVERTE · <b>A</b> Y <b>S</b> COMBOS · <b>Z</b> Y <b>X</b> PATADAS · <b>ESC</b> PAUSA · TAMBIÉN CON JOYSTICK
          <br />SI EL TECLADO NO RESPONDE, HAZ CLIC EN EL JUEGO
        </p>
      </section>
      <section id="ranking" class="pestana" hidden>
        <div class="caja">
          <h1>RANKING</h1>
          <div class="acento"></div>
          <p class="estadisticas" hidden></p>
          <nav class="tablas">
            <button type="button" data-tabla="puntos" class="activa">PUNTOS DE LIGA</button>
            <button type="button" data-tabla="victorias">VICTORIAS</button>
            <button type="button" data-tabla="racha">MEJOR RACHA</button>
            <button type="button" data-tabla="arcade">CAMPEONES DEL ARCADE</button>
          </nav>
          <nav class="dificultades" hidden></nav>
          <p class="explica"></p>
          <div class="tabla"></div>
        </div>
      </section>
      <footer class="pie">
        <div class="donar" hidden>
          <p>¿TE GUSTA EL JUEGO? AYÚDANOS A SEGUIR AGREGANDO LUCHADORES Y ESCENARIOS</p>
          <div class="botones-donar"></div>
        </div>
        <div class="firma">EL GRAN TORNEO DE CELL</div>
      </footer>
    </main>
    <script type="module" src="/src/web/portal.ts"></script>
  </body>
</html>
